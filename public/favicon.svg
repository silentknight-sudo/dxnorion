<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D898" />
      <stop offset="50%" stop-color="#C9A86A" />
      <stop offset="100%" stop-color="#9E7D42" />
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#162544" />
      <stop offset="100%" stop-color="#0B1426" />
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="url(#navyBg)" />

  <!-- Outer Fine Gold Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.75" opacity="0.9" />
  <!-- Inner Delicate Concentric Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="1.5, 2.5" opacity="0.6" />

  <!-- Orion Celestial Star Accent -->
  <path d="M 32 8.5 L 33.2 12.2 L 37 13.5 L 33.2 14.8 L 32 18.5 L 30.8 14.8 L 27 13.5 L 30.8 12.2 Z" fill="url(#goldGrad)" />

  <!-- Elegant 'DO' Monogram -->
  <g fill="url(#goldGrad)">
    <!-- Letter 'D' -->
    <path d="M 21 21 L 28 21 C 32.5 21 35.5 24 35.5 28.5 C 35.5 33 32.5 36 28 36 L 21 36 Z M 24.5 24 L 24.5 33 L 27.8 C 30.5 33 32.2 31.2 32.2 28.5 C 32.2 25.8 30.5 24 27.8 24 Z" />
    <!-- Letter 'O' (Interlocking Luxury) -->
    <path d="M 38 21 C 42.8 21 46.5 24.8 46.5 29.5 C 46.5 34.2 42.8 38 38 38 C 33.2 38 29.5 34.2 29.5 29.5 C 29.5 24.8 33.2 21 38 21 Z M 38 24.2 C 35.1 24.2 33 26.6 33 29.5 C 33 32.4 35.1 34.8 38 34.8 C 40.9 34.8 43 32.4 43 29.5 C 43 26.6 40.9 24.2 38 24.2 Z" opacity="0.85" />
  </g>

  <!-- Architectural Luxury Base Arch -->
  <path d="M 22 44.5 Q 32 41 42 44.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.25" stroke-linecap="round" opacity="0.8" />
  <circle cx="32" cy="48" r="1.2" fill="url(#goldGrad)" />
</svg>
