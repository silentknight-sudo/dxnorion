# Cloud Build pipeline for DXN Orion (Google Cloud Run + Cloud SQL)
steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:latest'
      - '.'

  # 2. Push Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dxn-orion-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}'
      - '--set-secrets=ADMIN_PASSWORD=dxn-admin-password:latest,JWT_SECRET=dxn-jwt-secret:latest,DB_PASS=dxn-db-pass:latest'
      - '--set-env-vars=NODE_ENV=production,DB_USER=dxn_db_user,DB_NAME=dxn_orion_db,INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},ADMIN_EMAIL=shivam@dxn-orion.com,APP_URL=https://dxn-orion.com'

substitutions:
  _INSTANCE_CONNECTION_NAME: 'your-gcp-project:asia-south1:dxn-orion-pg15'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/dxn-orion-repo/dxn-orion-app:latest'
